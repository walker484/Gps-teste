<!DOCTYPE html>
<html lang="pt‑BR">
<head>
<meta charset="UTF‑8">
<meta name="viewport" content="width=device‑width, initial‑scale=1.0">
<title>Mapa‑GPS Igarapé</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box‑sizing:border‑box;}
body{padding:8px;}
#mapa{width:100%;height:80vh;border‑radius:8px;}
.botao{padding:10px;border:none;border‑radius:8px;background:#2b6cb0;color:#fff;margin:4px;}
</style>
</head>
<body>
<button class="botao" onclick="iniciar()">▶️ Iniciar rota</button>
<button class="botao" onclick="parar()">⏹️ Parar</button>
<div id="mapa"></div>
<script>
let mapa,marcador,linha;
const latCasa =‑19.9522;
const lonCasa =‑43.9817;
let rodando = false;
let tempo;

function carregarMapa(){
  mapa = L.map('mapa').setView([latCasa,lonCasa],15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapa);
  marcador = L.marker([latCasa,lonCasa]).addTo(mapa);
  linha = L.polyline([],{color:"red"}).addTo(mapa);
}
function iniciar(){
  rodando = true;
  tempo = setInterval(posicao,4000);
}
function parar(){
  rodando = false;
  clearInterval(tempo);
}
function posicao(){
  navigator.geolocation.getCurrentPosition(p=>{
    let lat = p.coords.latitude;
    let lon = p.coords.longitude;
    marcador.setLatLng([lat,lon]);
    mapa.setView([lat,lon]);
    linha.addLatLng([lat,lon]);
  });
}
window.onload = carregarMapa;
</script>
</body>
</html>
